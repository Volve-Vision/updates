<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 420" width="1160" height="420" role="img" aria-label="Volve Vision delivery timeline">
  <defs>
    <linearGradient id="axis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2a6baa" stop-opacity="0.25"/>
      <stop offset="0.12" stop-color="#2a6baa" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#2a6baa" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <style>
    .l-t { font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .l-eyebrow { font-size: 12px; letter-spacing: 1.6px; text-transform: uppercase; fill: #5b6673; font-weight: 600; }
    .l-when { font-size: 13px; fill: #2a6baa; font-weight: 700; letter-spacing: .3px; }
    .l-what { font-size: 14.5px; fill: #16191c; font-weight: 600; }
    .l-sub { font-size: 12.5px; fill: #5b6673; }
    .l-era { font-size: 11.5px; fill: #5b6673; font-weight: 600; letter-spacing: .6px; }
  </style>
  <rect width="1160" height="420" rx="18" fill="#ffffff"/>
  <rect x="0.5" y="0.5" width="1159" height="419" rx="18" fill="none" stroke="#dde7f0"/>
  <text x="40" y="44" class="l-t l-eyebrow">How we got here</text>

  <rect x="40" y="62" width="150" height="22" rx="11" fill="#5b6673" fill-opacity="0.12"/>
  <text x="54" y="77" class="l-t l-era">FIRST GENERATION</text>
  <rect x="236" y="62" width="176" height="22" rx="11" fill="#2a6baa" fill-opacity="0.16"/>
  <text x="250" y="77" class="l-t l-era">PLATFORM REBUILD</text>

  <path d="M60 210 H1100" stroke="url(#axis)" stroke-width="3" stroke-linecap="round"/>
  <path d="M60 210 H200" stroke="#dde7f0" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round"/>

  <g class="l-t">
    <circle cx="72" cy="210" r="7" fill="#ffffff" stroke="#5b6673" stroke-width="2.5"/>
    <text x="72" y="168" class="l-when" text-anchor="middle" fill="#5b6673">2022</text>
    <text x="72" y="148" class="l-what" text-anchor="middle">First apps</text>
    <text x="72" y="130" class="l-sub" text-anchor="middle">early generation</text>

    <circle cx="220" cy="210" r="7" fill="#ffffff" stroke="#2a6baa" stroke-width="2.5"/>
    <text x="220" y="252" class="l-when" text-anchor="middle">DEC 2025</text>
    <text x="220" y="272" class="l-what" text-anchor="middle">Rebuild starts</text>
    <text x="220" y="290" class="l-sub" text-anchor="middle">clean slate</text>

    <circle cx="368" cy="210" r="7" fill="#ffffff" stroke="#2a6baa" stroke-width="2.5"/>
    <text x="368" y="168" class="l-when" text-anchor="middle">FEB 2026</text>
    <text x="368" y="148" class="l-what" text-anchor="middle">Service layer</text>
    <text x="368" y="130" class="l-sub" text-anchor="middle">catalogue foundation</text>

    <circle cx="516" cy="210" r="7" fill="#ffffff" stroke="#2a6baa" stroke-width="2.5"/>
    <text x="516" y="252" class="l-when" text-anchor="middle">APR 2026</text>
    <text x="516" y="272" class="l-what" text-anchor="middle">New website live</text>
    <text x="516" y="290" class="l-sub" text-anchor="middle">catalogue, maps, search</text>

    <circle cx="664" cy="210" r="9" fill="#2a6baa"/>
    <text x="664" y="168" class="l-when" text-anchor="middle">MAY-JUN 2026</text>
    <text x="664" y="148" class="l-what" text-anchor="middle">Accounts and payments</text>
    <text x="664" y="130" class="l-sub" text-anchor="middle">subscriptions, ads, editorial</text>

    <circle cx="812" cy="210" r="7" fill="#ffffff" stroke="#2a6baa" stroke-width="2.5"/>
    <text x="812" y="252" class="l-when" text-anchor="middle">JUL 2026</text>
    <text x="812" y="272" class="l-what" text-anchor="middle">Mobile apps</text>
    <text x="812" y="290" class="l-sub" text-anchor="middle">iOS and Android</text>

    <circle cx="960" cy="210" r="7" fill="#ffffff" stroke="#2a6baa" stroke-width="2.5"/>
    <text x="960" y="168" class="l-when" text-anchor="middle">AUG 2026</text>
    <text x="960" y="148" class="l-what" text-anchor="middle">VolveMenu launch</text>
    <text x="960" y="130" class="l-sub" text-anchor="middle">fourth language added</text>

    <circle cx="1096" cy="210" r="9" fill="#3aa655"/>
    <text x="1096" y="252" class="l-when" text-anchor="end" fill="#1f7a3a">SEP 2026</text>
    <text x="1096" y="272" class="l-what" text-anchor="end">Account security centre</text>
    <text x="1096" y="290" class="l-sub" text-anchor="end">web, apps and screens</text>
  </g>

  <g class="l-t">
    <rect x="40" y="330" width="1080" height="1" fill="#dde7f0"/>
    <text x="40" y="364" class="l-sub">Dates reflect when work shipped to production, taken from our own delivery history.</text>
    <text x="40" y="386" class="l-sub">Monthly detail lives in the updates folder of this repository.</text>
  </g>
</svg>
